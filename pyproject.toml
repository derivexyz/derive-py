[tool.poetry]
name = "derive-py"
version = "0.1.0"
description = "Python client for the Derive v3 API"
authors = [
  "8baller <8baller@station.codes>",
  "Zarathustra <zarathustra_git@pm.me>",
]
readme = "README.md"
packages = [{ include = "derive_py" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
requests = ">=2.31"
rich-click = ">=1.7.1"
python-dotenv = ">=0.14"
pandas = ">=2,<4"
pydantic = ">=2.11.3"
msgspec = ">=0.19,<1.0"
web3 = ">=7.14,<8"
websockets = ">=15"
aiohttp = ">=3.13"
click = ">=8.3"
rich = ">=14"
more-itertools = ">=10.8"
eth-abi = ">=5.2"
eth-account = ">=0.13.7"
eth-typing = ">=5.2"
eth-utils = ">=5.3"
hexbytes = ">=1.3"

[tool.poetry.scripts]
drv = "derive_py.cli:cli"

[tool.poetry.group.dev.dependencies]
pytest = "9.0.2"
tbump = "^6.11.0"
pytest-rerunfailures = "^13.0"
semver = ">=2.9.1,<3.0.0"
ruff = "^0.13.0"
datamodel-code-generator = "^0.58.0"
libcst = "^1.8.5"
pytest-asyncio = "1.3.0"
pyright = { version = "^1.1.407", extras = ["nodejs"] }
pandas-stubs = "^2.3.2.250926"
mkdocs-mermaid2-plugin = "^1.2.3"
deptry = "^0.25.1"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = "^9.6.20"
mkdocs-include-markdown-plugin = "^7.1.7"
mkdocs-mermaid2-plugin = "^1.2.2"
mkdocstrings = {extras = ["python"], version = "^0.30.1"}
mkdocs-gen-files = "^0.5.0"
mkdocs-literate-nav = "^0.6.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pyright]
include = ["derive_py", "tests"]
exclude = ["**/__pycache__", "derive_py/data/generated"]
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
pythonVersion = "3.11"

[tool.mypy]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "derive_action_signing"
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py311"
respect-gitignore = true
extend-exclude = [
  ".eggs",
  ".git",
  ".hg",
  ".mypy_cache",
  ".tox",
  ".venv",
  "_build",
  "buck-out",
  "build",
  "dist",
  "docs/conf.py",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "SIM", # flake8-simplify
  #  "B",   # flake8-bugbear
  #  "UP",  # pyupgrade
  #  "C4",  # flake8-comprehensions
  #  "PT",  # flake8-pytest-style (if you use pytest)
  #  "RUF", # Ruff-specific rules
]

[tool.ruff.lint.isort]
split-on-trailing-comma = true

[tool.ruff.format]
# Replace Black
line-ending = "auto"
quote-style = "preserve"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
markers = ["live: hits live Ethereum RPC endpoints, not run in CI"]
addopts = "--strict-markers"

[tool.deptry]
known_first_party = ["derive_py"]

[tool.deptry.per_rule_ignores]
DEP003 = ["pydantic_core"]
