name: Audit

# Catches advisories published against an unchanged poetry.lock, which no push would surface.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install osv-scanner
        run: make install-osv-scanner

      - name: Audit
        run: make audit

  # The only job holding a token that can write issues, and it runs none of the repository's code.
  report:
    needs: [audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      issues: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      # A failure opens one issue and comments on it while it stays open; a clean run closes it.
      - name: Failure issue
        env:
          AUDIT: ${{ needs.audit.result }}
        run: |
          title="Scheduled audit failed"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ "$AUDIT" = failure ]; then
            if [ -n "$number" ]; then
              gh issue comment "$number" --body "Failed again: $RUN_URL"
            else
              gh issue create --title "$title" --body "audit: $AUDIT. $RUN_URL"
            fi
          elif [ "$AUDIT" = success ]; then
            if [ -n "$number" ]; then gh issue close "$number" --comment "Passed: $RUN_URL"; fi
          else
            echo "audit: $AUDIT; no issue changed"
          fi
