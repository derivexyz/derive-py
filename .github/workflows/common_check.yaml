name: Code Quality

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
        poetry-version: ["2.1.3"]
        os: [ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and configure Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ matrix.poetry-version }}
          virtualenvs-create: true
          virtualenvs-in-project: false
          virtualenvs-path: ~/my-custom-path
          installer-parallel: true

      # Every target of `make all`, one step each, so a failure names itself.
      # Steps stop at the first failure. Keep this list and `make all` in step:
      # scripts/hooks/pre-push reads the run commands straight out of this file.
      - name: Install Packages
        run: poetry install -v

      - name: Download ABIs
        run: poetry run make download-abis

      - name: Codegen
        run: poetry run make codegen-all

      - name: Format
        run: poetry run make fmt

      - name: Lint
        run: poetry run make lint

      - name: Deptry
        run: poetry run make deptry

      - name: Typecheck
        run: poetry run make typecheck

      - name: Docs
        run: poetry run make docs

      - name: Diff Check
        run: poetry run make check_diff

      - name: Tests
        run: poetry run make tests
