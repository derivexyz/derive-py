# On every push to main, publish the version in pyproject.toml to PyPI
# (trusted publishing) and cut a matching v* tag + GitHub release.
# Pushes whose version is already tagged are a no-op.

name: release & publish workflow

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-24.04
    # Must match the environment configured on the PyPI trusted publisher.
    environment: pypi

    permissions:
      contents: write # push tag, create GitHub release
      id-token: write # PyPI trusted publishing

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # fetch tags so already-released versions are detected

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.1.3"

      - name: Check whether this version is already released
        id: version
        run: |
          VERSION="$(poetry version -s)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already tagged; nothing to release."
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build wheels and source tarball
        if: steps.version.outputs.released == 'false'
        run: poetry build

      # Publish before tagging, so a failed upload leaves no orphan tag/release
      # and the job can simply be re-run.
      - name: Publish package distributions to PyPI
        if: steps.version.outputs.released == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Configure git identity
        if: steps.version.outputs.released == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create tag and GitHub release
        if: steps.version.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: make release
